<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Silk House Table — dinner party host</title>
<style>
  :root{
    --ink:#2b2336;
    --ink-soft:#473c57;
    --brass:#b1853a;
    --brass-light:#d6b270;
    --brass-glow:rgba(177,133,58,.14);
    --paper:#f1ece2;
    --surface:#fbf8f1;
    --surface-2:#f6f1e7;
    --line:#e2d9c8;
    --line-strong:#cdbfa6;
    --text:#2b2336;
    --muted:#766b82;
    --sage:#5f7d5a;      /* coming */
    --sage-soft:#e3ecdf;
    --amber:#bd862f;     /* maybe  */
    --amber-soft:#f4e8d2;
    --dusty:#9a8fa2;     /* declined */
    --dusty-soft:#ece7ee;
    --danger:#a8413a;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(43,35,54,.06), 0 8px 24px -14px rgba(43,35,54,.22);
    --shadow-lift:0 2px 4px rgba(43,35,54,.08), 0 18px 40px -18px rgba(43,35,54,.32);
    --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--body);
    color:var(--text);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:inherit}

  /* ---------- header ---------- */
  .topbar{
    background:
      radial-gradient(120% 140% at 85% -20%, rgba(214,178,112,.22), transparent 55%),
      var(--ink);
    color:#f4eee2;
    padding:20px 22px 0;
  }
  .topbar-inner{max-width:1080px;margin:0 auto}
  .brand{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
  .brand h1{
    font-family:var(--display);
    font-weight:600;
    font-size:30px;
    letter-spacing:.3px;
    margin:0;
    color:#f6efe2;
  }
  .brand .flourish{color:var(--brass-light);font-style:italic;font-weight:400}
  .brand p{margin:0;color:#b9aec3;font-size:13.5px;letter-spacing:.2px}
  nav.tabs{display:flex;gap:4px;margin-top:18px;flex-wrap:wrap}
  nav.tabs button{
    background:transparent;border:0;color:#b9aec3;
    padding:11px 15px 13px;font-size:14.5px;font-weight:600;
    border-bottom:2px solid transparent;letter-spacing:.2px;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:#efe7d8}
  nav.tabs button.active{color:#fff;border-color:var(--brass-light)}

  /* ---------- layout ---------- */
  main{max-width:1080px;margin:0 auto;padding:26px 22px 80px}
  .view{display:none;animation:rise .35s ease both}
  .view.active{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view,.view.active{animation:none}}

  .row-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .eyebrow{font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--brass);font-weight:700;margin:0 0 5px}
  h2.section{font-family:var(--display);font-weight:600;font-size:25px;margin:0;color:var(--ink)}
  h3{font-family:var(--display);font-weight:600;margin:0}
  .muted{color:var(--muted)}
  .brand h1,h2.section,h3,.pc-top .ttl,.course .dish,.stat .s b,.date-chip .d{letter-spacing:-.021em}

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--ink);background:var(--ink);color:#f6efe2;
    padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;
    display:inline-flex;align-items:center;gap:7px;transition:transform .12s, box-shadow .15s, background .15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn:active{transform:none}
  .btn.brass{background:var(--brass);border-color:var(--brass)}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.sm{padding:7px 13px;font-size:13px}
  .btn.danger{background:transparent;color:var(--danger);border-color:#e2c4c1}
  .btn.danger:hover{background:#f6e8e6}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;gap:18px}
  @media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}

  .party-card{padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:transform .14s, box-shadow .16s, border-color .16s}
  .party-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line-strong)}
  .party-card .date-chip{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:54px;height:58px;border-radius:11px;background:var(--ink);color:#f3ead8;flex:0 0 auto;line-height:1;
  }
  .date-chip .m{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass-light);margin-bottom:3px}
  .date-chip .d{font-family:var(--display);font-size:22px;font-weight:600}
  .pc-top{display:flex;gap:14px;align-items:center}
  .pc-top .ttl{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2}
  .pc-top .sub{font-size:13px;color:var(--muted);margin-top:2px}

  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:999px;text-transform:uppercase}
  .pill.planning{background:var(--amber-soft);color:#7c531a}
  .pill.upcoming{background:var(--sage-soft);color:#3c5538}
  .pill.past{background:var(--dusty-soft);color:#5d5266}
  .pill.attended{background:var(--sage);color:#fff;display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
  .g-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .prof-line{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .prof-line:first-of-type{border-top:0}
  .prof-line:hover{color:var(--brass)}

  .seatline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .seatdots{display:flex;gap:5px}
  .sd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}
  .sd.full{background:var(--brass);border-color:var(--brass)}
  .sd.over{background:var(--danger);border-color:var(--danger)}
  .seatline .lbl{font-size:13px;color:var(--muted);font-weight:600}

  /* ---------- empty state ---------- */
  .empty{text-align:center;padding:54px 20px;border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface)}
  .empty svg{opacity:.55;margin-bottom:6px}
  .empty h3{font-size:20px;margin:8px 0 6px}
  .empty p{margin:0 auto 18px;max-width:380px;color:var(--muted)}

  /* ---------- forms / modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(33,26,42,.5);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:28px 16px;z-index:50;overflow:auto}
  .scrim.show{display:flex}
  .modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;box-shadow:var(--shadow-lift);border:1px solid var(--line);animation:rise .25s ease both}
  .modal header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
  .modal header h3{font-size:21px}
  .modal .body{padding:22px 24px}
  .modal footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 18px 18px}
  .x{background:none;border:0;font-size:24px;color:var(--muted);line-height:1;padding:4px 8px;border-radius:8px}
  .x:hover{background:var(--surface-2);color:var(--ink)}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--text);transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-glow)}
  .field textarea{resize:vertical;min-height:64px}
  .two-col{display:grid;gap:14px}
  @media(min-width:520px){.two-col{grid-template-columns:1fr 1fr}}
  .hint{font-size:12.5px;color:var(--muted);margin-top:5px}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .chip{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .chip:hover{border-color:var(--brass);color:var(--brass)}

  /* ---------- detail view ---------- */
  .detail-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
  .back{background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:6px 0;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
  .back:hover{color:var(--ink)}
  .detail-grid{display:grid;gap:20px;margin-top:20px}
  @media(min-width:840px){.detail-grid{grid-template-columns:320px 1fr}}
  .panel{padding:20px}
  .panel h3{font-size:16px;letter-spacing:.2px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .panel h3 .count{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

  /* seat map */
  .tablewrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  .tablewrap .cap{font-size:13px;color:var(--muted);text-align:center}
  .seat-init{font-family:var(--body);font-weight:700}

  /* guest rows */
  .guest-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
  .guest-row:first-of-type{border-top:0}
  .avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:var(--ink-soft)}
  .g-name{font-weight:600;font-size:14.5px;line-height:1.2}
  .g-meta{font-size:12px;color:var(--muted)}
  .grow{flex:1;min-width:0}
  .rsvp-seg{display:flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
  .rsvp-seg button{border:0;background:transparent;padding:5px 9px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
  .rsvp-seg button.on.yes{background:var(--sage);color:#fff}
  .rsvp-seg button.on.maybe{background:var(--amber);color:#fff}
  .rsvp-seg button.on.no{background:var(--dusty);color:#fff}
  .rsvp-seg button.on.inv{background:var(--ink-soft);color:#fff}

  /* menu list */
  .course{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .course:first-of-type{border-top:0}
  .course .ctag{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--brass);min-width:74px;padding-top:3px}
  .course .dish{font-family:var(--display);font-size:16px;font-weight:500}
  .course .cnote{font-size:13px;color:var(--muted);margin-top:2px}
  .course .cnote a{color:var(--brass);font-weight:600;text-decoration:none}
  .course .cnote a:hover{text-decoration:underline}

  .archive-photo{width:100%;max-height:280px;object-fit:contain;border-radius:var(--radius) var(--radius) 0 0;display:block;background:var(--ink)}
  .photo-frame{border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:18px;text-align:center;color:var(--muted)}
  .photo-frame img{max-width:100%;border-radius:8px;margin-bottom:10px}
  .photo-dropzone{border:2px dashed var(--line-strong);border-radius:var(--radius-sm);padding:22px;text-align:center;color:var(--muted);transition:border-color .15s,background .15s}
  .photo-dropzone.drag-over{border-color:var(--brass);background:var(--brass-glow)}
  /* carousel */
  .carousel{position:relative;user-select:none}
  .carousel-track-wrap{overflow:hidden;border-radius:var(--radius-sm)}
  .carousel-track{display:flex;transition:transform .3s ease}
  .carousel-slide{flex:0 0 100%;position:relative;cursor:zoom-in}
  .carousel-slide img{width:100%;height:220px;object-fit:cover;display:block}
  .carousel-caption{padding:7px 10px;font-size:12.5px;color:var(--muted);min-height:28px;text-align:center}
  .carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(43,35,54,.55);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .15s}
  .carousel-btn:hover{background:rgba(43,35,54,.85)}
  .carousel-btn.prev{left:8px}
  .carousel-btn.next{right:8px}
  .carousel-btn:disabled{opacity:.25;pointer-events:none}
  .carousel-dots{display:flex;justify-content:center;gap:6px;padding:6px 0 4px}
  .carousel-dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);border:0;padding:0;cursor:pointer;transition:background .15s}
  .carousel-dot.on{background:var(--brass)}
  .carousel-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 10px;flex-wrap:wrap}
  /* lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:90;padding:20px;flex-direction:column;gap:12px}
  #lightbox.show{display:flex}
  #lightbox img{max-width:100%;max-height:80vh;border-radius:10px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.6)}
  #lightbox .lb-cap{color:rgba(255,255,255,.75);font-size:14px;text-align:center;max-width:560px}
  #lightbox .lb-close{position:fixed;top:18px;right:22px;background:none;border:0;color:#fff;font-size:32px;line-height:1;cursor:pointer;opacity:.7}
  #lightbox .lb-close:hover{opacity:1}
  #lightbox .lb-nav{display:flex;gap:18px;align-items:center}
  #lightbox .lb-nav button{background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 18px;border-radius:999px;font-size:20px;cursor:pointer;transition:background .15s}
  #lightbox .lb-nav button:hover{background:rgba(255,255,255,.3)}
  #lightbox .lb-nav button:disabled{opacity:.2;pointer-events:none}
  #lightbox .lb-counter{color:rgba(255,255,255,.55);font-size:13px;min-width:50px;text-align:center}

  /* notes: fixed-size, full-width box (scrolls if the text is longer) */
  #partyNotes{display:block;width:100%;height:190px;min-height:190px;resize:none;overflow-y:auto;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);line-height:1.5;transition:border-color .15s, box-shadow .15s}
  #partyNotes:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-glow)}
  /* to-do list */
  .todo-add{display:flex;gap:8px;margin-bottom:6px}
  .todo-add input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14.5px;transition:border-color .15s, box-shadow .15s}
  .todo-add input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-glow)}
  .todo-row{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .todo-row:first-child{border-top:0}
  .todo-row input[type=checkbox]{flex:0 0 18px;width:18px;height:18px;margin:2px 0 0;accent-color:var(--brass);cursor:pointer}
  .todo-row .todo-text{flex:1;min-width:0;font-size:14.5px;line-height:1.4;word-break:break-word}
  .todo-row.done .todo-text{text-decoration:line-through;color:var(--muted)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap}
  .stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
  .stat .s{display:flex;flex-direction:column}
  .stat .s b{font-family:var(--display);font-size:24px;font-weight:600;line-height:1}
  .stat .s span{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}

  .note-banner{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:18px}
  /* archive view toggle */
  .view-toggle{display:flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;flex-shrink:0}
  .view-toggle button{border:0;background:transparent;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .view-toggle button.on{background:var(--ink);color:#f3ead8}
  /* timeline */
  .timeline{position:relative;padding-left:28px}
  .timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line-strong);border-radius:2px}
  .tl-item{position:relative;margin-bottom:28px}
  .tl-dot{position:absolute;left:-24px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--brass);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--brass)}
  .tl-year{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass);margin-bottom:8px;margin-left:-28px;padding-left:28px}
  .tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:transform .14s,box-shadow .16s,border-color .16s}
  .tl-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line-strong)}
  .tl-body{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
  .tl-date-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:52px;border-radius:9px;flex:0 0 auto;line-height:1}
  .tl-date-chip .m{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;margin-bottom:2px}
  .tl-date-chip .d{font-size:20px;font-weight:600}
  .tl-info{flex:1;min-width:0}
  .tl-info h3{font-size:16px;margin:0 0 4px}
  .tl-dishes{font-size:13px;color:var(--muted);margin:0 0 6px;line-height:1.4}
  .tl-photo{width:100%;max-height:220px;object-fit:contain;display:block;background:var(--ink);border-top:1px solid var(--line)}
  .nudge{max-width:1080px;margin:0 auto}
  .nudge-inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-soft);border:1px solid #e7d3ad;border-radius:var(--radius-sm);padding:11px 15px;margin-top:18px;font-size:13.5px;color:#6f4e16}
  .nudge-inner .grow{flex:1;min-width:160px}
  .invite-box{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;font-size:13.5px;line-height:1.55;max-height:240px;overflow:auto}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#f3ead8;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lift);opacity:0;transition:opacity .25s, transform .25s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .tag{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--ink-soft);margin:2px 3px 0 0;font-weight:600}
  .inline-link{background:none;border:0;color:var(--brass);font-weight:600;font-size:13px;padding:0}
  .inline-link:hover{text-decoration:underline}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #pickerRows div[data-pickrow]:first-child { border-top:0 }
  #dropveil{pointer-events:none;position:fixed;inset:0;background:rgba(43,35,54,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
  #dropveil.show{display:flex}
  #dropveil .vcard{background:var(--surface);border:2px dashed var(--brass);border-radius:20px;padding:40px 48px;text-align:center;box-shadow:var(--shadow-lift);pointer-events:none}

<script>
/* ============================================================
   Storage layer — persists data so the tool remembers between
   visits. Picks the best backend available, in order:
     1. window.storage  (Claude.ai artifact runtime)
     2. IndexedDB       (standalone file — large capacity, fits photos)
     3. localStorage    (standalone fallback — smaller capacity)
     4. in-memory       (last resort; not saved between sessions)
   Each layer is feature-detected and wrapped so it degrades
   gracefully rather than throwing.
============================================================ */
let backend=null;

function openIDB(){
  return new Promise((res,rej)=>{
    let idb; try{ idb = (typeof indexedDB!=='undefined') ? indexedDB : null; }catch(e){ idb=null; }
    if(!idb){ rej(new Error('no indexedDB')); return; }
    let req; try{ req=idb.open('silkHouseTable',1); }catch(e){ rej(e); return; }
    req.onupgradeneeded=()=>{ try{ req.result.createObjectStore('kv'); }catch(e){} };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error||new Error('idb error'));
    req.onblocked=()=>rej(new Error('idb blocked'));
  });
}
function idbBackend(db){
  const op=(mode,fn)=>new Promise((res,rej)=>{
    let store; try{ store=db.transaction('kv',mode).objectStore('kv'); }catch(e){ rej(e); return; }
    const r=fn(store); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return {
    kind:'idb',
    get:async k=>{ const v=await op('readonly',s=>s.get(k)); return v===undefined?null:v; },
    set:async (k,v)=>{ await op('readwrite',s=>s.put(v,k)); return true; },
    del:async k=>{ await op('readwrite',s=>s.delete(k)); }
  };
}
async function initStorage(){
  // 1. Claude artifact storage
  try{
    if(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function'){
      backend={ kind:'claude',
        get:async k=>{ const r=await window.storage.get(k); return r?r.value:null; },
        set:async (k,v)=>{ await window.storage.set(k,v); return true; },
        del:async k=>{ await window.storage.delete(k); } };
      return;
    }
  }catch(e){}
  // 2. IndexedDB
  try{ const db=await openIDB(); backend=idbBackend(db);
    // probe round-trip
    await backend.set('__sht_probe__','1'); await backend.get('__sht_probe__'); await backend.del('__sht_probe__');
    return;
  }catch(e){}
  // 3. localStorage
  try{
    const t='__sht_test__'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    backend={ kind:'local',
      get:async k=>{ const v=localStorage.getItem(k); return v===null?null:v; },
      set:async (k,v)=>{ localStorage.setItem(k,v); return true; },
      del:async k=>{ localStorage.removeItem(k); } };
    return;
  }catch(e){}
  // 4. in-memory (no persistence)
  const mem=new Map();
  backend={ kind:'memory', get:async k=>mem.has(k)?mem.get(k):null, set:async(k,v)=>{mem.set(k,v);return true;}, del:async k=>{mem.delete(k);} };
}
async function sGet(key){ try{ return await backend.get(key); }catch(e){ return null; } }
async function sSet(key,val){ try{ return await backend.set(key,val); }catch(e){ console.error('storage.set failed',e); return false; } }
async function sDel(key){ try{ await backend.del(key); }catch(e){} }

const K_GUESTS='dinner:guests';
const K_PARTIES='dinner:parties';
const K_DISHES='dinner:dishes';   // [{dish, course, notes, url, count, lastUsed}]
const photoKey = id => 'dinner:photos:'+id;    // stores JSON array [{dataURL,caption}]
const photoKeyLegacy = id => 'dinner:photo:'+id; // old single-photo key for migration
const gbookKey = id => 'dinner:guestbook:'+id;  // guest-book images, JSON array [{dataURL,caption}]
// config per image kind so photos and guest-book entries share the same machinery
const IMG_KINDS={
  photo:    {key:photoKey,    cache:'detailPhotoCache', prop:'photos',    slot:'photoSlot',    noun:'photo'},
  guestbook:{key:gbookKey,    cache:'gbookCache',       prop:'guestbook', slot:'gbookSlot',     noun:'guest-book image'}
};

async function loadJSON(key,fallback){
  const raw = await sGet(key);
  if(raw==null) return fallback;
  try{ return JSON.parse(raw); }catch(e){ return fallback; }
}

/* ============================================================
   State
============================================================ */
let guests = [];
let parties = [];
let dishLibrary = [];   // persisted dish archive
let currentDetail = null;          // party id when in detail view
let activeTab = 'next';
let detailPhotoCache = {};         // id -> photos array (loaded lazily)
let gbookCache = {};               // id -> guest-book images array
let guestSort = 'first';           // 'first' | 'last' | 'added'
let guestFilter = 'all';           // 'all' | 'new'
let archiveView = 'grid';          // 'grid' | 'timeline'

// time a guest was added — uses addedAt, falling back to the timestamp baked into the id
function addedKey(g){
  if(typeof g.addedAt==='number') return g.addedAt;
  const t=parseInt((g.id||'').slice(0,8),36);
  return isNaN(t)?0:t;
}
function lastNameKey(g){
  const parts=(g.name||'').trim().split(/\s+/);
  return ((parts[parts.length-1]||'')+' '+(parts[0]||'')).toLowerCase();
}
function sortedGuests(){
  const arr=guests.slice();
  if(guestSort==='added') arr.sort((a,b)=>addedKey(a)-addedKey(b));
  else if(guestSort==='last') arr.sort((a,b)=>lastNameKey(a).localeCompare(lastNameKey(b)));
  else arr.sort((a,b)=>(a.name||'').toLowerCase().localeCompare((b.name||'').toLowerCase()));
  return arr;
}

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $ = sel => document.querySelector(sel);

/* ============================================================
   Persistence helpers
============================================================ */
async function saveGuests(){ await sSet(K_GUESTS, JSON.stringify(guests)); }
async function saveParties(){ await sSet(K_PARTIES, JSON.stringify(parties)); }
async function saveDishes(){ await sSet(K_DISHES, JSON.stringify(dishLibrary)); }
// Record or update a dish in the library when a course is saved
async function archiveDish(data){
  const key=data.dish.trim().toLowerCase();
  const existing=dishLibrary.find(d=>d.dish.trim().toLowerCase()===key);
  if(existing){
    existing.count=(existing.count||1)+1;
    existing.lastUsed=Date.now();
    // update recipe/notes if newly provided
    if(data.notes&&!existing.notes) existing.notes=data.notes;
    if(data.url&&!existing.url) existing.url=data.url;
    if(data.course) existing.course=data.course;
  } else {
    dishLibrary.push({dish:data.dish.trim(), course:data.course||'', notes:data.notes||'', url:data.url||'', count:1, lastUsed:Date.now()});
  }
  await saveDishes();
}

/* ============================================================
   Date helpers
============================================================ */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ const dt=parseDate(s); if(!dt) return 'Date TBD'; return WDAYS[dt.getDay()]+', '+MONTHS_FULL[dt.getMonth()]+' '+dt.getDate(); }
function fmtShort(s){ const dt=parseDate(s); if(!dt) return {m:'—',d:'?'}; return {m:MONTHS[dt.getMonth()], d:dt.getDate()}; }
// Seasonal colour for the timeline date chip (northern hemisphere, earthy palette)
function seasonChip(dateStr){
  const dt=parseDate(dateStr); const m=dt?dt.getMonth():-1;
  if(m===11||m===0||m===1) return {bg:'#2d6a9f',text:'#e8f4ff'}; // winter — bright cobalt blue
  if(m===2 ||m===3||m===4) return {bg:'#3a8c4e',text:'#e6f7ea'}; // spring — fresh leaf green
  if(m===5 ||m===6||m===7) return {bg:'#c47c0a',text:'#fff8e1'}; // summer — golden amber/sun
  if(m===8 ||m===9||m===10)return {bg:'#b84c1a',text:'#fdeee8'}; // autumn — vivid burnt orange-red
  return {bg:'#2b2336',text:'#f3ead8'};
}
function todayISO(){ const t=new Date(); return t.toISOString().slice(0,10); }
function isPastDate(s){ const dt=parseDate(s); if(!dt) return false; const t=new Date(); t.setHours(0,0,0,0); return dt<t; }

// derive status: explicit "past"/"planning" honored; otherwise infer from date
function effStatus(p){
  if(p.archived) return 'past';
  if(p.date && isPastDate(p.date)) return 'past';
  if(!p.date) return 'planning';
  return 'upcoming';
}

// suggest upcoming dates for a preferred weekday, skipping dates already used
function suggestDates(weekday, count){
  const used = new Set(parties.map(p=>p.date).filter(Boolean));
  const out=[]; const cur=new Date(); cur.setHours(0,0,0,0);
  cur.setDate(cur.getDate()+10);             // start ~1.5 weeks out
  let guard=0;
  while(out.length<count && guard<400){
    guard++;
    if(cur.getDay()===weekday){
      const iso=cur.toISOString().slice(0,10);
      if(!used.has(iso)) out.push(iso);
      cur.setDate(cur.getDate()+7);
    } else {
      cur.setDate(cur.getDate()+1);
    }
  }
  return out;
}

/* ============================================================
   RSVP / seat math
============================================================ */
function rsvpCounts(p){
  const c={yes:0,maybe:0,no:0,inv:0};
  (p.invites||[]).forEach(i=>{ c[i.status]=(c[i.status]||0)+1; });
  return c;
}
function comingCount(p){ return (p.invites||[]).filter(i=>i.status==='yes').length; }
function awaiting(p){ return (p.invites||[]).filter(i=>i.status==='inv'); }
function guestById(id){ return guests.find(g=>g.id===id); }
// names of guests who said yes, in seating-plan order where one exists (used by the archive)
function attendeeNames(p){
  return planOrder(p).map(id=>guestById(id)).filter(Boolean).map(g=>g.name).join(' · ');
}
function initials(name){
  const parts=(name||'').trim().split(/\s+/);
  if(!parts[0]) return '?';
  return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}
function avatarColor(id){
  const palette=['#5f7d5a','#b1853a','#7a6391','#9a6a4a','#4f7080','#a8567a','#6b7a4f','#8a5a5a'];
  let h=0; for(const ch of (id||'')) h=(h*31+ch.charCodeAt(0))>>>0;
  return palette[h%palette.length];
}

/* ============================================================
   Seat-map SVG (the signature element)
============================================================ */
function comingGuestIds(p){ return (p.invites||[]).filter(i=>i.status==='yes').map(i=>i.guestId); }
// p.seats counts everyone at the table, including the host; guests get one fewer
function guestSeats(p){ return (p.seats||8)-1; }
// resolved seating order: honour saved plan, drop anyone no longer coming, append new yeses
function planOrder(p){
  const coming=comingGuestIds(p);
  const set=new Set(coming);
  let plan=(p.seatPlan||[]).filter(id=>set.has(id));
  coming.forEach(id=>{ if(plan.indexOf(id)===-1) plan.push(id); });
  return plan;
}

/* GAUGE/PREVIEW — mirrors the seating plan exactly: host at the head on the right,
   confirmed guests in their planned (edited) order, evenly spread. Falls back to the
   empty capacity table before anyone has RSVPed yes. */
function seatMapSVG(p){
  const cap = guestSeats(p);
  const order = planOrder(p);                  // edited arrangement of confirmed guests
  const n = order.length;
  const W=300,H=250,cx=W/2,cy=H/2;
  const tRx=92, tRy=58, sRx=124, sRy=92, dot=17;
  const seatsToShow = n>0 ? n : cap;           // no RSVPs yet → show the empty capacity table
  const total = seatsToShow+1;                 // +1 reserved for the host
  const step = 2*Math.PI/total;                // same even spacing the planner uses
  const FB="-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif";
  const FD="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Roboto,sans-serif";
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:300px" role="img" aria-label="Table with ${n+1} of ${cap+1} seats filled, including you">`;
  svg+=`<ellipse cx="${cx}" cy="${cy}" rx="${tRx}" ry="${tRy}" fill="#fbf8f1" stroke="#cdbfa6" stroke-width="2"/>`;
  svg+=`<ellipse cx="${cx}" cy="${cy}" rx="${tRx-9}" ry="${tRy-9}" fill="none" stroke="#e2d9c8" stroke-width="1"/>`;
  // host at the head, on the right (angle 0)
  svg+=`<g transform="translate(${cx+tRx+20},${cy})"><circle r="13" fill="#2b2336"/><text y="4" text-anchor="middle" font-family="${FB}" font-size="10.5" font-weight="700" fill="#d6b270">You</text></g>`;
  svg+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="${FD}" font-size="26" font-weight="600" fill="#2b2336">${n+1}/${cap+1}</text>`;
  svg+=`<text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="${FB}" font-size="10.5" font-weight="700" letter-spacing="1" fill="#766b82">SEATS FILLED</text>`;
  for(let i=0;i<seatsToShow;i++){
    const ang=(i+1)*step;                       // skip angle 0 (the host)
    const x=cx+sRx*Math.cos(ang), y=cy+sRy*Math.sin(ang);
    const g = order[i] ? guestById(order[i]) : null;
    if(g){
      svg+=`<g transform="translate(${x},${y})"><circle r="${dot}" fill="${avatarColor(g.id)}"/><text y="4.5" text-anchor="middle" font-family="${FB}" font-size="12" font-weight="700" fill="#fff">${initials(g.name)}</text></g>`;
    } else {
      svg+=`<circle cx="${x}" cy="${y}" r="${dot}" fill="#f6f1e7" stroke="#cdbfa6" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    }
  }
  svg+=`</svg>`;
  return svg;
}

/* PLAN — named seats, host at the head on the right, everyone distributed evenly */
function planTableSVG(p, selectedPos){
  const order = planOrder(p);
  const n = order.length, total = n+1;
  const W=460,H=340,cx=W/2,cy=H/2;
  const tRx=150, tRy=92, sRx=192, sRy=120, dot=21;
  const step = 2*Math.PI/total;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:460px;overflow:visible" role="img" aria-label="Seating plan, ${total} at the table">`;
  svg+=`<ellipse cx="${cx}" cy="${cy}" rx="${tRx}" ry="${tRy}" fill="#fbf8f1" stroke="#cdbfa6" stroke-width="2"/>`;
  svg+=`<ellipse cx="${cx}" cy="${cy}" rx="${tRx-10}" ry="${tRy-10}" fill="none" stroke="#e2d9c8" stroke-width="1"/>`;
  // host at the head on the right
  svg+=`<g transform="translate(${cx+tRx+26},${cy})">
    <circle r="17" fill="#2b2336"/>
    <text y="5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#d6b270">You</text>
    <text y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" letter-spacing=".5" fill="#766b82">HEAD</text>
  </g>`;
  svg+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Roboto,sans-serif" font-size="30" font-weight="600" fill="#2b2336">${total}</text>`;
  svg+=`<text x="${cx}" y="${cy+18}" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#766b82">AT THE TABLE</text>`;
  for(let i=0;i<n;i++){
    const ang=(i+1)*step;
    const x=cx+sRx*Math.cos(ang), y=cy+sRy*Math.sin(ang);
    const g=guestById(order[i]); if(!g) continue;
    const dx=Math.cos(ang), dy=Math.sin(ang);
    const lx=x+dx*32, ly=y+dy*30+4;
    const anchor = dx>0.25?'start':(dx<-0.25?'end':'middle');
    svg+=`<g class="planseat" data-pos="${i}" style="cursor:pointer">`;
    if(selectedPos===i) svg+=`<circle cx="${x}" cy="${y}" r="${dot+5}" fill="none" stroke="#b1853a" stroke-width="2.5"/>`;
    svg+=`<circle cx="${x}" cy="${y}" r="${dot}" fill="${avatarColor(g.id)}"/>`;
    svg+=`<text x="${x}" y="${y+5}" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#fff">${initials(g.name)}</text>`;
    svg+=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#2b2336">${escapeHTML(g.name.split(/\s+/)[0])}</text>`;
    svg+=`</g>`;
  }
  svg+=`</svg>`;
  return svg;
}

/* Seating-plan modal */
let planSel=null;
function openSeatingPlan(partyId){
  const p=parties.find(x=>x.id===partyId);
  if(comingGuestIds(p).length===0){
    modal('Seating plan',`<p class="muted">No one's confirmed yet. Once guests reply “Yes”, you can arrange where they sit.</p>`,[{label:'Close',cls:'ghost',act:closeModal}]);
    return;
  }
  planSel=null;
  modal('Seating plan',`
    <p class="hint" style="margin-top:0">You're at the head, on the right. Tap one guest, then tap another to swap their seats.</p>
    <div id="planWrap" style="display:flex;justify-content:center;padding:8px 0 2px"></div>
    <p class="hint" id="planMsg" style="text-align:center;min-height:18px;margin:0"></p>
  `,[
    {label:'Shuffle',cls:'ghost',act:async()=>{ const o=planOrder(p); for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=o[i];o[i]=o[j];o[j]=t;} p.seatPlan=o; planSel=null; await saveParties(); drawPlan(p); $('#planMsg').textContent='Shuffled.'; }},
    {label:'Reset order',cls:'ghost',act:async()=>{ p.seatPlan=comingGuestIds(p).slice(); planSel=null; await saveParties(); drawPlan(p); $('#planMsg').textContent=''; }},
    {label:'Done',cls:'brass',act:()=>{ closeModal(); if(currentDetail===partyId) renderDetail(parties.find(x=>x.id===partyId)); }}
  ]);
  drawPlan(p);
}
function drawPlan(p){
  const wrap=$('#planWrap'); if(!wrap) return;
  wrap.innerHTML=planTableSVG(p, planSel);
  wrap.querySelectorAll('.planseat').forEach(g=>{
    g.onclick=async()=>{
      const pos=Number(g.dataset.pos);
      if(planSel===null){ planSel=pos; drawPlan(p); $('#planMsg').textContent='Now tap another seat to swap.'; }
      else if(planSel===pos){ planSel=null; drawPlan(p); $('#planMsg').textContent=''; }
      else{
        const o=planOrder(p); const t=o[planSel]; o[planSel]=o[pos]; o[pos]=t;
        p.seatPlan=o; planSel=null; await saveParties(); drawPlan(p); $('#planMsg').textContent='Swapped.';
      }
    };
  });
}

/* ============================================================
   Rendering — tabs
============================================================ */
function setTab(tab){
  activeTab=tab; currentDetail=null;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  ['next','parties','guests','archive','detail'].forEach(v=>{
    $('#view-'+v).classList.toggle('active', v===tab);
  });
  if(tab==='next') renderNext();
  if(tab==='parties') renderParties();
  if(tab==='guests') renderGuests();
  if(tab==='archive') renderArchive();
  window.scrollTo({top:0,behavior:'smooth'});
}

function seatDots(p){
  const seats=guestSeats(p), coming=comingCount(p);
  let dots='';
  for(let i=0;i<seats;i++) dots+=`<span class="sd ${i<coming?'full':''}"></span>`;
  for(let i=seats;i<coming;i++) dots+=`<span class="sd over"></span>`;
  return `<span class="seatdots">${dots}</span>`;
}

  const s=effStatus(p), sd=fmtShort(p.date), coming=comingCount(p);

      </div>

    </div>
  `,[{label:'Close',cls:'ghost',act:closeModal}]);

    const inp=document.createElement('input'); inp.type='file'; inp.accept='.vcf,.csv,text/vcard,text/csv,text/plain';

// read a dropped/chosen contacts file, detect format, open the review step
function handleContactFile(file){
  const name=(file.name||'').toLowerCase();
  const rd=new FileReader();
  rd.onload=e=>{ const txt=String(e.target.result);
    if(/BEGIN:VCARD/i.test(txt)) showImportReview(parseVCF(txt));
    else if(name.endsWith('.csv')||txt.indexOf(',')>=0) showImportReview(parseCSV(txt));
    else toast('That doesn’t look like a contacts file (.vcf or .csv)');
  };
  rd.onerror=()=>toast('Could not read that file');
  rd.readAsText(file);
}
async function pickFromContacts(){
  try{
    const supported = navigator.contacts.getProperties ? await navigator.contacts.getProperties() : ['name','email','tel'];
    const props=['name','email','tel'].filter(p=>supported.includes(p));
    const sel=await navigator.contacts.select(props,{multiple:true});
    const list=sel.map(c=>({name:(c.name&&c.name[0])||'',email:(c.email&&c.email[0])||'',phone:(c.tel&&c.tel[0])||''})).filter(c=>c.name||c.email);
    showImportReview(list);
  }catch(err){ toast('Couldn’t open contacts here — try the file export instead'); }
}
function parseVCF(text){
  const cards=text.split(/BEGIN:VCARD/i).slice(1), out=[];
  cards.forEach(block=>{
    const raw=block.split(/\r\n|\r|\n/), lines=[];
    raw.forEach(l=>{ if(/^[ \t]/.test(l)&&lines.length) lines[lines.length-1]+=l.replace(/^[ \t]/,''); else lines.push(l); });
    let fn='',n='',email='',tel='';
    lines.forEach(line=>{
      const idx=line.indexOf(':'); if(idx<0) return;
      const prop=line.slice(0,idx).split(';')[0].toUpperCase(), val=line.slice(idx+1).trim();
      if(prop==='FN'&&!fn) fn=val.replace(/\\,/g,',');
      else if(prop==='N'&&!n){ const p=val.split(';'); n=((p[1]||'')+' '+(p[0]||'')).trim(); }
      else if(prop==='EMAIL'&&!email) email=val;
      else if(prop==='TEL'&&!tel) tel=val;
    });
    const name=(fn||n).trim();
    if(name||email) out.push({name:name||email,email,phone:tel});
  });
  return out;
}
function csvRows(text){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true;
      else if(c===',' ){ row.push(cur); cur=''; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=c; } }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x&&x.trim()));
}
function parseCSV(text){
  const rows=csvRows(text); if(rows.length<2) return [];
  const header=rows[0].map(h=>h.toLowerCase().trim());
  const find=(...keys)=>header.findIndex(h=>keys.some(k=>h.includes(k)));
  const exact=name=>header.indexOf(name);
  const iName = exact('name')>=0?exact('name'):find('display name','full name');
  const iGiven=find('given name','first name'), iFamily=find('family name','last name');
  const iEmail=find('e-mail','email','mail'), iPhone=find('phone','tel','mobile');
  const first=s=>(s||'').split(/\s*:::\s*|\s*;\s*/)[0].trim();
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    let name=iName>=0?(row[iName]||'').trim():'';
    if(!name) name=[iGiven>=0?row[iGiven]:'',iFamily>=0?row[iFamily]:''].filter(Boolean).join(' ').trim();
    const email=iEmail>=0?first(row[iEmail]):'', phone=iPhone>=0?first(row[iPhone]):'';
    if(name||email) out.push({name:name||email,email,phone});
  }
  return out;
}
function showImportReview(list){
  if(!list||!list.length){ modal('Import contacts',`<p class="muted">No contacts found in that file. The most reliable export is a vCard (.vcf) from your Contacts app.</p>`,[{label:'Close',cls:'ghost',act:closeModal}]); return; }
  importList=list;
  const dupOf=c=>guests.some(g=> (c.email&&g.email&&g.email.toLowerCase()===c.email.toLowerCase()) || (g.name||'').toLowerCase()===(c.name||'').toLowerCase());
  const rows=list.map((c,i)=>{ const dup=dupOf(c);
    return `<label style="display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer">
      <input type="checkbox" data-imp="${i}" ${dup?'':'checked'} ${dup?'disabled':''} style="width:18px;height:18px;accent-color:var(--brass)">
      <span class="avatar" style="width:30px;height:30px;font-size:12px;background:${dup?'#cdbfa6':'var(--ink-soft)'}">${initials(c.name)}</span>
      <span class="grow"><span class="g-name">${escapeHTML(c.name)}</span>
        <span class="g-meta">${[c.email,c.phone].filter(Boolean).map(escapeHTML).join(' · ')||'&nbsp;'}${dup?' · already on your list':''}</span></span>
    </label>`; }).join('');
  modal('Import contacts',`<p class="hint" style="margin-top:0">Found ${list.length} contact${list.length>1?'s':''}. Tick who to add to your guest list.</p>${rows}`,
  [{label:'Cancel',cls:'ghost',act:closeModal},
   {label:'Add selected',cls:'brass',act:async()=>{
     const picks=[...document.querySelectorAll('[data-imp]')].filter(c=>c.checked).map(c=>importList[Number(c.dataset.imp)]);
     picks.forEach(c=>guests.push({id:uid(),name:c.name,email:c.email||'',phone:c.phone||'',dietary:'',notes:'',tags:[],addedAt:Date.now()}));
     await saveGuests(); closeModal(); renderGuests(); toast(picks.length?`Added ${picks.length} guest${picks.length>1?'s':''}`:'Nothing added');
   }}]);
}

  const bg=$('#archBtnGrid'), bt=$('#archBtnTimeline');

}
function mountArchivePhoto(p, slot, cls){
  const hasPhotos=(p.photos&&p.photos.length)||p.hasPhoto;
  if(hasPhotos){
    loadPhotos(p.id).then(photos=>{
      if(photos&&photos[0]){ const img=document.createElement('img'); img.className=cls; img.src=photos[0].dataURL; img.alt=p.title||'dinner'; slot.appendChild(img); }
      else slot.remove();
    });
  } else slot.remove();
}

function imgCacheGet(kind,id){ return (kind==='guestbook'?gbookCache:detailPhotoCache)[id]; }
function imgCacheSet(kind,id,v){ (kind==='guestbook'?gbookCache:detailPhotoCache)[id]=v; }
async function loadImages(id, kind){
  const cfg=IMG_KINDS[kind];
  const cached=imgCacheGet(kind,id);
  if(cached!==undefined) return cached;
  let raw=await sGet(cfg.key(id));
  if(raw){ try{ const arr=JSON.parse(raw); imgCacheSet(kind,id,Array.isArray(arr)?arr:[]); return imgCacheGet(kind,id); }catch(e){} }
  // migrate legacy single-photo (photos only)
  if(kind==='photo'){
    const legacy=await sGet(photoKeyLegacy(id));
    if(legacy){
      const arr=[{dataURL:legacy, caption:''}];
      await sSet(cfg.key(id), JSON.stringify(arr));
      await sDel(photoKeyLegacy(id));
      imgCacheSet(kind,id,arr);
      const p=parties.find(x=>x.id===id);
      if(p){ p.photos=arr; delete p.hasPhoto; delete p.photoCaption; await saveParties(); }
      return arr;
    }
  }
  imgCacheSet(kind,id,[]);
  return [];
}

/* shared lightbox — state lives here so Photos and Guest book never overwrite each other */
let lbList=[], lbIdx=0;
function openLB(list,i){ lbList=list; lbIdx=i; $('#lightbox').classList.add('show'); updLB(); }
function closeLB(){ $('#lightbox').classList.remove('show'); }
function updLB(){
  if(!lbList[lbIdx]) return;
  $('#lbImg').src=lbList[lbIdx].dataURL;
  $('#lbCap').textContent=lbList[lbIdx].caption||'';
  $('#lbCounter').textContent=`${lbIdx+1} / ${lbList.length}`;
  $('#lbPrev').disabled=lbIdx===0;
  $('#lbNext').disabled=lbIdx===lbList.length-1;
}
$('#lbClose').onclick=closeLB;
$('#lbPrev').onclick=()=>{ if(lbIdx>0){ lbIdx--; updLB(); } };
$('#lbNext').onclick=()=>{ if(lbIdx<lbList.length-1){ lbIdx++; updLB(); } };
$('#lightbox').onclick=e=>{ if(e.target.id==='lightbox') closeLB(); };
document.addEventListener('keydown',e=>{
  if(!$('#lightbox').classList.contains('show')) return;
  if(e.key==='ArrowLeft'&&lbIdx>0){ lbIdx--; updLB(); }
  if(e.key==='ArrowRight'&&lbIdx<lbList.length-1){ lbIdx++; updLB(); }
  if(e.key==='Escape') closeLB();
});

function renderImageSlot(p, list, kind){
  const cfg=IMG_KINDS[kind];
  const pre=kind; // id prefix to avoid collisions between the two panels
  const el=$('#'+cfg.slot); if(!el) return;
  list=list||[];
  const Noun=cfg.noun; const NounCap=Noun.charAt(0).toUpperCase()+Noun.slice(1);
  let html='';
  if(list.length===1){
    html+=`<div style="margin-bottom:10px">
      <img src="${list[0].dataURL}" alt="${escapeAttr(p.title||'dinner')}" data-lb="0"
        style="width:100%;height:220px;object-fit:cover;border-radius:var(--radius-sm);display:block;cursor:zoom-in;margin-bottom:6px">
      <div class="carousel-meta">
        <span style="font-size:12.5px;color:var(--muted)">${escapeHTML(list[0].caption||'')}</span>
        <div style="display:flex;gap:6px">
          <button class="btn ghost sm" data-cap="0">Edit caption</button>
          <button class="btn danger sm" data-del="0">Remove</button>
        </div>
      </div>
    </div>`;
  } else if(list.length>1){
    html+=`<div class="carousel" id="${pre}Carousel">
      <div class="carousel-track-wrap">
        <div class="carousel-track" id="${pre}Track">
          ${list.map((ph,i)=>`<div class="carousel-slide">
            <img src="${ph.dataURL}" alt="${escapeAttr(p.title||'dinner')}" data-lb="${i}">
          </div>`).join('')}
        </div>
      </div>
      <button class="carousel-btn prev" id="${pre}Prev">&#8592;</button>
      <button class="carousel-btn next" id="${pre}Next">&#8594;</button>
    </div>
    <div class="carousel-dots" id="${pre}Dots">
      ${list.map((_,i)=>`<button class="carousel-dot${i===0?' on':''}" data-dot="${i}"></button>`).join('')}
    </div>
    <div class="carousel-caption" id="${pre}Caption">${escapeHTML(list[0].caption||'')}</div>
    <div class="carousel-meta">
      <span class="muted" style="font-size:12.5px" id="${pre}Counter">1 / ${list.length}</span>
      <div style="display:flex;gap:6px">
        <button class="btn ghost sm" id="${pre}EditCap">Edit caption</button>
        <button class="btn danger sm" id="${pre}DelImg">Remove</button>
      </div>
    </div>`;
  }
  html+=`<div class="photo-dropzone" id="${pre}DropZone" style="margin-top:${list.length?'10px':'0'}">
    <p style="margin:0 0 10px;font-size:13.5px">${list.length?('Drop another '+Noun+' here, or'):('Drop '+(kind==='guestbook'?'a guest-book image':'a photo')+' here, or')}</p>
    <button class="btn ghost sm" id="${pre}AddBtn">choose a file</button>
  </div>`;
  el.innerHTML=html;

  async function persist(){
    await sSet(cfg.key(p.id), JSON.stringify(list));
    imgCacheSet(kind,p.id,list); p[cfg.prop]=list;
    if(kind==='photo'){ delete p.hasPhoto; delete p.photoCaption; }
    await saveParties();
  }

  // lightbox is shared; each slot hands it its own list when an image is clicked
  el.querySelectorAll('[data-lb]').forEach(img=>img.onclick=()=>openLB(list,Number(img.dataset.lb)));

  // single-image wiring
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    list.splice(Number(b.dataset.del),1); await persist(); renderImageSlot(p,list,kind); toast(NounCap+' removed');
  });
  el.querySelectorAll('[data-cap]').forEach(b=>b.onclick=async()=>{
    const i=Number(b.dataset.cap); const cap=prompt('Edit caption:',list[i].caption||'')||'';
    list[i].caption=cap; await persist(); renderImageSlot(p,list,kind);
  });

  // carousel wiring
  if(list.length>1){
    let cur=0;
    const track=$('#'+pre+'Track'), dots=[...$('#'+pre+'Dots').querySelectorAll('.carousel-dot')];
    function goTo(i){
      cur=Math.max(0,Math.min(i,list.length-1));
      track.style.transform=`translateX(-${cur*100}%)`;
      dots.forEach((d,j)=>d.classList.toggle('on',j===cur));
      $('#'+pre+'Caption').textContent=list[cur].caption||'';
      $('#'+pre+'Counter').textContent=`${cur+1} / ${list.length}`;
      $('#'+pre+'Prev').disabled=cur===0;
      $('#'+pre+'Next').disabled=cur===list.length-1;
    }
    goTo(0);
    $('#'+pre+'Prev').onclick=()=>goTo(cur-1);
    $('#'+pre+'Next').onclick=()=>goTo(cur+1);
    dots.forEach(d=>d.onclick=()=>goTo(Number(d.dataset.dot)));
    let tx=0;
    track.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; },{passive:true});
    track.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40){ dx<0?goTo(cur+1):goTo(cur-1); } });
    $('#'+pre+'EditCap').onclick=async()=>{
      const cap=prompt('Edit caption:',list[cur].caption||'')||''; list[cur].caption=cap; await persist(); renderImageSlot(p,list,kind);
    };
    $('#'+pre+'DelImg').onclick=async()=>{
      list.splice(cur,1); await persist(); renderImageSlot(p,list,kind); toast(NounCap+' removed');
    };
  }

  // drop zone
  $('#'+pre+'AddBtn').onclick=()=>pickImage(p.id,kind);
  const zone=$('#'+pre+'DropZone');
  let zoneDrag=0;
  zone.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); zoneDrag++; zone.classList.add('drag-over'); });
  zone.addEventListener('dragover', e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
  zone.addEventListener('dragleave',e=>{ zoneDrag=Math.max(0,zoneDrag-1); if(!zoneDrag) zone.classList.remove('drag-over'); });
  zone.addEventListener('drop',     e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.stopPropagation(); zoneDrag=0; zone.classList.remove('drag-over'); showVeil(false); dragDepth=0;
    const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) handleImageFile(p.id,f,kind); else toast('Drop an image file here'); });
}

// back-compat wrapper
function renderPhotoSlot(p, photos){ renderImageSlot(p, photos, 'photo'); }

async function handleImageFile(id, file, kind){
  const cfg=IMG_KINDS[kind];
  resizeImage(file, async dataURL=>{
    const list=await loadImages(id,kind);
    const cap=prompt('Add a caption? (optional)','')||'';
    list.push({dataURL, caption:cap});
    const ok=await sSet(cfg.key(id), JSON.stringify(list));
    if(!ok){ toast('Could not save — it may be too large'); list.pop(); return; }
    const p=parties.find(x=>x.id===id);
    p[cfg.prop]=list; if(kind==='photo'){ delete p.hasPhoto; delete p.photoCaption; }
    imgCacheSet(kind,id,list);
    await saveParties(); renderImageSlot(p, list, kind); toast(kind==='guestbook'?'Guest-book image saved':'Photo saved');
  });
}
async function handlePhotoFile(id, file){ return handleImageFile(id,file,'photo'); }

function pickImage(id, kind){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=()=>{ [...inp.files].forEach(f=>handleImageFile(id,f,kind)); };
  inp.click();
}
function pickPhoto(id){ pickImage(id,'photo'); }
function resizeImage(file, cb){
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{
    const max=1100; let {width:w,height:h}=img;
    if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',0.82));
  }; img.src=e.target.result; };
  reader.readAsDataURL(file);
}

  const editing = (typeof idx==='number');

  const courses=['Nibbles','Starter','Main','Side','Dessert','Drinks','Other'];
  // build library suggestions sorted by most-used then most-recent
  const libSorted=dishLibrary.slice().sort((a,b)=>(b.count-a.count)||((b.lastUsed||0)-(a.lastUsed||0)));
  const courseOrder=['Nibbles','Starter','Main','Side','Dessert','Drinks','Other'];
  const libHTML=libSorted.length?`
    <div class="field"><label>From your dish archive</label>
      <select id="dishPick" style="width:100%">
        <option value="">— choose a past dish to fill the form —</option>
        ${courseOrder.map(course=>{
          const items=libSorted.filter(d=>(d.course||'Other')===course);
          if(!items.length) return '';
          return `<optgroup label="${escapeAttr(course)}">`+
            items.map((d,_)=>{
              const i=libSorted.indexOf(d);
              return `<option value="${i}">${escapeAttr(d.dish)}${d.count>1?' (×'+d.count+')':''}`;
            }).join('')+
            `</optgroup>`;
        }).join('')}
      </select>
    </div>`:'';
  modal(editing?'Edit course':'Add a course',`
    ${libHTML}
    <div class="field"><label>${libSorted.length?'Or enter something new — course':'Course'}</label>
      <select id="c_course">${courses.map(c=>`<option ${(m.course||'Main')===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Dish</label><input id="c_dish" value="${escapeAttr(m.dish||'')}" placeholder="e.g. Slow-roast lamb shoulder"></div>
    <div class="field"><label>Notes / prep</label><textarea id="c_notes" placeholder="Marinate the night before; serves 8…">${escapeHTML(m.notes||'')}</textarea></div>
    <div class="field"><label>Recipe link (optional)</label><input id="c_url" value="${escapeAttr(m.url||'')}" placeholder="https://…"></div>
  `,[
    editing?{label:'Delete',cls:'danger',act:async()=>{ p.menu.splice(idx,1); await saveParties(); closeModal(); renderMenu(p); toast('Course removed'); }}:null,
    {label:'Cancel',cls:'ghost',act:closeModal},
    {label:editing?'Save changes':'Add course',cls:'brass',act:async()=>{
      const dish=$('#c_dish').value.trim(); if(!dish){ toast('Give the dish a name'); return; }
      const data={course:$('#c_course').value,dish,notes:$('#c_notes').value.trim(),url:$('#c_url').value.trim()};
      p.menu=p.menu||[];
      if(editing) p.menu[idx]=data; else p.menu.push(data);
      await saveParties();
      await archiveDish(data);
      closeModal(); renderMenu(p); toast(editing?'Course updated':'Course added');
    }}
  ].filter(Boolean));
  // wire up archive dropdown
  const dp=$('#dishPick');
  if(dp) dp.onchange=()=>{
    if(!dp.value) return;
    const d=libSorted[Number(dp.value)];
    const sel=$('#c_course'); if(sel&&d.course&&courses.includes(d.course)) sel.value=d.course;
    const dish=$('#c_dish'); if(dish) dish.value=d.dish;
    const notes=$('#c_notes'); if(notes&&d.notes&&!notes.value) notes.value=d.notes;
    const url=$('#c_url'); if(url&&d.url&&!url.value) url.value=d.url;
    dp.value='';   // reset so the same dish can be re-selected if needed
    toast('Filled from archive — adjust if needed');
  };
}

/* MODAL: guest form */
/* categorize a guest's involvement across all dinners */
function guestHistory(g){
  const attended=[], upcoming=[], declined=[], maybe=[], awaiting=[];
  parties.forEach(p=>{
    const inv=(p.invites||[]).find(i=>i.guestId===g.id); if(!inv) return;
    const past=effStatus(p)==='past';
    if(inv.status==='yes') (past?attended:upcoming).push(p);
    else if(inv.status==='no') declined.push(p);
    else if(inv.status==='maybe') maybe.push(p);
    else awaiting.push(p);
  });
  attended.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  declined.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  maybe.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  awaiting.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  upcoming.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return {attended,upcoming,declined,maybe,awaiting};
}

/* ============================================================
   Backup: export everything to a file, import to restore
============================================================ */
async function gatherBackup(){
  const photos={}, guestbook={};
  for(const p of parties){
    const arr=await loadPhotos(p.id);
    if(arr&&arr.length) photos[p.id]=arr;
    const gb=await loadGuestbook(p.id);
    if(gb&&gb.length) guestbook[p.id]=gb;
  }
  const photoCount=Object.values(photos).reduce((s,a)=>s+a.length,0);
  return { app:'silk-house-table', version:3, exportedAt:new Date().toISOString(), guests, parties, photos, guestbook, dishes:dishLibrary, _photoCount:photoCount };
}
/* backup reminder: nudge if it's been over a month, with a grace period from first use */
const K_LASTBACKUP='dinner:lastBackup';
const K_REMINDER='dinner:reminderAnchor';
const BACKUP_INTERVAL=30*86400000;
async function markBackedUp(){ try{ await sSet(K_LASTBACKUP,String(Date.now())); }catch(e){} const el=$('#backupNudge'); if(el) el.style.display='none'; }
async function backupOverdue(){
  if(!(parties.length||guests.length)) return false;       // nothing worth backing up yet
  const last=await sGet(K_LASTBACKUP);
  if(last) return (Date.now()-Number(last))>BACKUP_INTERVAL;
  let anchor=await sGet(K_REMINDER);                        // never backed up → count from first use
  if(!anchor){ anchor=String(Date.now()); await sSet(K_REMINDER,anchor); }
  return (Date.now()-Number(anchor))>BACKUP_INTERVAL;
}
function showBackupNudge(){
  const el=$('#backupNudge'); if(!el) return;
  el.innerHTML=`<div class="nudge-inner">
    <span class="grow">It's been over a month since your last backup. A quick export keeps your dinners safe.</span>
    <button class="btn brass sm" id="nudgeBackup">Back up now</button>
    <button class="inline-link" id="nudgeDismiss" style="white-space:nowrap">Not now</button>
  </div>`;
  el.style.display='block';
  $('#nudgeBackup').onclick=()=>{ el.style.display='none'; exportData(); };
  $('#nudgeDismiss').onclick=()=>{ el.style.display='none'; };   // returns next session if still overdue
}
async function exportData(){
  toast('Preparing backup…');
  const payload=await gatherBackup();
  const json=JSON.stringify(payload);
  const photoCount=payload._photoCount||Object.keys(payload.photos).length;
  const sizeKB=Math.max(1,Math.round(json.length/1024));
  const fname='silk-house-table-backup-'+new Date().toISOString().slice(0,10)+'.json';
  modal('Back up your data',`
    <p class="hint" style="margin-top:0">This file holds ${parties.length} dinner${parties.length===1?'':'s'}, ${guests.length} guest${guests.length===1?'':'s'}${photoCount?`, and ${photoCount} photo${photoCount===1?'':'s'}`:''} — about ${sizeKB} KB. Save it somewhere safe; you can import it into any version to restore everything. If the download doesn't start, use “Copy as text” and paste it into a file.</p>
  `,[
    {label:'Copy as text',cls:'ghost',act:()=>{ copyText(json); markBackedUp(); }},
    {label:'Download file',cls:'brass',act:()=>{
      try{
        const blob=new Blob([json],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download=fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1500); toast('Backup downloaded'); markBackedUp();
      }catch(e){ toast('Download blocked here — use “Copy as text” instead'); }
    }}
  ]);
}
function importData(){
  modal('Restore from a backup',`
    <p class="hint" style="margin-top:0">Choose a backup file, or paste the backup text. This replaces everything currently in the tool.</p>
    <div class="field"><button class="btn ghost" id="impBackupFile" type="button">Choose a backup file</button></div>
    <div class="field"><label>or paste backup text</label><textarea id="impBackupText" placeholder="Paste the contents of a backup file here…" style="min-height:90px"></textarea></div>
  `,[
    {label:'Cancel',cls:'ghost',act:closeModal},
    {label:'Continue',cls:'brass',act:()=>{ const t=($('#impBackupText').value||'').trim(); if(!t){ toast('Paste backup text or choose a file'); return; } parseBackup(t); }}
  ]);
  $('#impBackupFile').onclick=()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json,text/plain';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=e=>parseBackup(String(e.target.result)); rd.onerror=()=>toast('Could not read that file'); rd.readAsText(f); };
    inp.click();
  };
}
function parseBackup(text){
  let data; try{ data=JSON.parse(text); }catch(err){ toast('That isn’t a valid backup file'); return; }
  if(!data||data.app!=='silk-house-table'||!Array.isArray(data.guests)||!Array.isArray(data.parties)){ toast('That doesn’t look like a Silk House Table backup'); return; }
  confirmRestore(data);
}
function confirmRestore(data){
  const pC=data.parties.length, gC=data.guests.length;
  const when=data.exportedAt?` (saved ${new Date(data.exportedAt).toLocaleDateString()})`:'';
  modal('Restore from backup',`<p class="muted">This will replace everything currently in the tool with the backup${when}: <b>${pC} dinner${pC===1?'':'s'}</b> and <b>${gC} guest${gC===1?'':'s'}</b>. Your current data will be overwritten — consider exporting it first if you're unsure.</p>`,
  [{label:'Cancel',cls:'ghost',act:closeModal},
   {label:'Replace with backup',cls:'brass',act:async()=>{ await doRestore(data); closeModal(); }}]);
}
async function doRestore(data){
  for(const p of parties){ try{ await sDel(photoKey(p.id)); await sDel(photoKeyLegacy(p.id)); await sDel(gbookKey(p.id)); }catch(e){} }
  guests=Array.isArray(data.guests)?data.guests:[];
  parties=Array.isArray(data.parties)?data.parties:[];
  dishLibrary=Array.isArray(data.dishes)?data.dishes:[];
  detailPhotoCache={}; gbookCache={};
  await saveGuests(); await saveParties(); await saveDishes();
  const photos=data.photos||{};
  for(const id of Object.keys(photos)){
    try{
      const val=photos[id];
      const arr=Array.isArray(val)?val:(typeof val==='string'?[{dataURL:val,caption:''}]:null);
      if(arr){ await sSet(photoKey(id), JSON.stringify(arr)); detailPhotoCache[id]=arr; }
    }catch(e){}
  }
  const guestbook=data.guestbook||{};
  for(const id of Object.keys(guestbook)){
    try{
      const arr=guestbook[id];
      if(Array.isArray(arr)){ await sSet(gbookKey(id), JSON.stringify(arr)); gbookCache[id]=arr; }
    }catch(e){}
  }
  setTab('next'); toast('Backup restored'); markBackedUp();
}

}
function bindEmpty(){
  const b=$('#emptyBtn'); if(!b) return;
  b.onclick=()=>{ if(b.dataset.act==='newParty') openPartyForm(); if(b.dataset.act==='newGuest') openGuestForm(); };
}
function bindOpens(scope){ scope.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(el.dataset.open)); }

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('Copied to clipboard')).catch(()=>fallbackCopy(txt)); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('Copied');}catch(e){toast('Copy failed — select manually');} ta.remove(); }
function escapeHTML(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHTML(s); }

/* tab clicks */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#btnExportData').onclick=exportData;
$('#btnImportData').onclick=importData;
$('#btnDishArchive').onclick=openDishArchive;
function openDishArchive(){
  if(!dishLibrary.length){
    modal('Dish archive',`<p class="muted">No dishes saved yet. Every course you add to a dinner is automatically remembered here for next time.</p>`,[{label:'Close',cls:'ghost',act:closeModal}]);
    return;
  }
  const renderLib=()=>{
    const sorted=dishLibrary.slice().sort((a,b)=>(b.count-a.count)||((b.lastUsed||0)-(a.lastUsed||0)));
    const rows=sorted.map((d,i)=>`<div class="guest-row" style="${i?'':'border-top:0'}">
      <div class="grow">
        <div class="g-name">${escapeHTML(d.dish)}</div>
        <div class="g-meta">${escapeHTML(d.course)}${d.count>1?' · made '+d.count+' times':''}${d.url?` · <a href="${escapeAttr(d.url)}" target="_blank" rel="noopener" style="color:var(--brass);font-weight:600">recipe ↗</a>`:''}</div>
        ${d.notes?`<div class="g-meta" style="margin-top:2px">${escapeHTML(d.notes)}</div>`:''}
      </div>
      <button class="btn danger sm" data-delib="${i}">Remove</button>
    </div>`).join('');
    const body=$('#dlBody'); if(body) body.innerHTML=rows;
    document.querySelectorAll('[data-delib]').forEach(btn=>btn.onclick=async()=>{
      const i=Number(btn.dataset.delib);
      dishLibrary.splice(dishLibrary.indexOf(sorted[i]),1);
      await saveDishes();
      if(!dishLibrary.length){ closeModal(); openDishArchive(); return; }
      renderLib();
    });
  };
  modal('Dish archive',`
    <p class="hint" style="margin-top:0">${dishLibrary.length} dish${dishLibrary.length===1?'':'es'} remembered. Sorted by how often you've made them. Remove anything you no longer want.</p>
    <div id="dlBody" class="card panel" style="padding:0 16px;max-height:360px;overflow-y:auto"></div>
  `,[{label:'Close',cls:'brass',act:closeModal}]);
  renderLib();
}

/* drag & drop — contacts (vCard/CSV) or photo (image) anywhere on the window */
const hasFiles = e => e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types||[], 'Files') >= 0;
let dragDepth=0;
function showVeil(on, label){
  const veil=$('#dropveil');
  if(on && label){ const p=veil.querySelector('p'); if(p) p.textContent=label; }
  veil.classList.toggle('show', on);
}
window.addEventListener('dragenter', e=>{
  if(!hasFiles(e)) return; e.preventDefault(); dragDepth++;
  // peek at the file type if available to tailor the label
  const items=e.dataTransfer && e.dataTransfer.items;
  const isImg=items && [...items].some(i=>i.type&&i.type.startsWith('image/'));
  const onDetail=!!currentDetail;
  const label= isImg&&onDetail ? 'Release onto Photos or Guest book to add it'
              : isImg           ? 'Release to add a photo'
              :                   'Release your .vcf or .csv file';
  showVeil(true, label);
});
window.addEventListener('dragover', e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
window.addEventListener('dragleave', e=>{ if(!hasFiles(e)) return; dragDepth=Math.max(0,dragDepth-1); if(dragDepth===0) showVeil(false); });
window.addEventListener('drop', e=>{
  if(!hasFiles(e)) return;
  e.preventDefault(); dragDepth=0; showVeil(false);
  const f=e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  if(f.type.startsWith('image/')){
    // photo drop — only meaningful when viewing a dinner detail
    if(currentDetail){
      const inGbook=e.target&&e.target.closest&&e.target.closest('#gbookCard');
      handleImageFile(currentDetail, f, inGbook?'guestbook':'photo');
    }
    else toast('Open a dinner first to add a photo');
  } else {
    handleContactFile(f);
  }
});

/* ============================================================
   Boot
============================================================ */
(async function init(){
  await initStorage();
  guests = await loadJSON(K_GUESTS,[]);
  parties = await loadJSON(K_PARTIES,[]);
  dishLibrary = await loadJSON(K_DISHES,[]);
  // re-save immediately so storage always reflects the current in-memory state
  await saveGuests(); await saveParties();
  const savedSort=await sGet('dinner:guestSort'); if(savedSort) guestSort=savedSort;
  const savedFilter=await sGet('dinner:guestFilter'); if(savedFilter) guestFilter=savedFilter;
  const savedArchView=await sGet('dinner:archiveView'); if(savedArchView) archiveView=savedArchView;
  await scrubOrphanedData();
  const st=$('#storeStatus');
  if(st){
    if(backend.kind==='memory') st.textContent='⚠ This view isn’t saving data — export to keep a copy.';
    else if(backend.kind==='claude') st.textContent='Your data is saved automatically.';
    else st.textContent='Your data is saved in this browser automatically.';
  }
  if(backend.kind==='memory'){
    setTimeout(()=>toast('Heads up: this view can’t save data — export to keep a copy'),600);
  }
  setTab('next');
  if(await backupOverdue()) showBackupNudge();
})();

/* scrub any stored data that refers to parties/guests that no longer exist */
async function scrubOrphanedData(){
  try{
    const validIds=new Set(parties.map(p=>p.id));
    const validGuestIds=new Set(guests.map(g=>g.id));
    // strip invites referencing guests that no longer exist
    let dirty=false;
    parties.forEach(p=>{
      if(!p.invites) return;
      const before=p.invites.length;
      p.invites=p.invites.filter(i=>validGuestIds.has(i.guestId));
      if(p.invites.length!==before) dirty=true;
    });
    if(dirty) await saveParties();
  }catch(e){ /* best-effort; never block startup */ }
}
